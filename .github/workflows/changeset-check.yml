name: Changeset check

on:
  pull_request:
    branches: ['**']
    paths:
      - 'svelte/**'
      - 'nextjs/**'
      - 'shared/**'
      - 'registry/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          # The runner's cached Node 24 can be older than the 24.22 the Cloudflare `cf` CLI requires,
          # and engineStrict fails the install on it
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! pnpm changeset status --since="origin/${BASE_REF}" 2>&1; then
            echo "::warning::No changeset found. If this PR changes a registry that needs a release, run 'pnpm changeset' to add one."
          fi
